<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Potato Disease Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f7f2;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 700px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #2e7d32;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        input {
            margin: 20px;
            padding: 10px;
        }

        button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        #result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
        }

        img {
            max-width: 300px;
            margin-top: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🥔 Potato Disease Prediction</h1>

        <p>
            Upload a potato leaf image to check the disease.
        </p>

        <input type="file" id="imageInput" accept="image/*">

        <br>

        <img id="preview" style="display:none;">

        <br>

        <button onclick="predictDisease()">
            Predict Disease
        </button>

        <div id="result"></div>

    </div>

    <script>

        const imageInput = document.getElementById("imageInput");
        const preview = document.getElementById("preview");

        imageInput.addEventListener("change", function() {

            const file = this.files[0];

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            }

        });

        function predictDisease() {

            const file = imageInput.files[0];

            if (!file) {
                document.getElementById("result").innerHTML =
                    "⚠️ Please upload a potato leaf image.";
                return;
            }

            document.getElementById("result").innerHTML =
                "🔍 Image uploaded successfully!<br><br>" +
                "⚠️ CNN prediction is not connected yet.";

        }

    </script>

</body>
</html>
